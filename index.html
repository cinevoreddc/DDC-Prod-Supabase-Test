<div id="root"><div class="auth-shell"><div class="auth-card"><div class="symbol">D</div><h1>DDC Prod Expenses Management</h1><p>Chargement de l'application…</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
let token='',state=null,view='dashboard',selection=null,search='',filter='all',navOpen=false,busy=false,toastTimer,lastRefreshAt=0;
const SUPABASE_URL='https://nxesaslonnkxvoyrrrfj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_m8-ByFHJArQSe9MThvLdnA_5y6dLuPX';
const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
}) ?? null;
const PHASE_TEST = 'Centre de notifications actif. Les actions restent contrôlées par Supabase. Utilisez des données fictives pendant les tests.';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar=n=>(Number(n)||0).toLocaleString('fr-FR')+' Ar';
const dateText=x=>{if(!x)return '—';const d=new Date(x);return isNaN(d.getTime())?'—':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});};
const statusConfig={en_cours:['En cours','pending'],validee:['Validée','ok'],refusee:['Refusée','no'],en_attente:['En attente','pending'],decaisse:['Décaissé','ok'],envoye:['Envoyé','info'],non_soumis:['À transmettre','pending'],a_verifier:['À vérifier','pending'],conforme:['Conforme','ok'],a_corriger:['À corriger','no']};
const badge=v=>{const [t,c]=statusConfig[v]||[v||'—',''];return `<span class="badge ${c}">${esc(t)}</span>`;};
const look=(rows,key,val,field)=>rows.find(x=>String(x[key])===String(val))?.[field]||'';
const byId=id=>state.requests.find(r=>r.id===id);
const catName=r=>`${r.categorie_code} · ${look(state.categories,'code',r.categorie_code,'libelle')}`;
const accountName=r=>`${r.compte_code} · ${state.accounts.find(x=>String(x.code)===String(r.compte_code)&&String(x.categorie_code)===String(r.categorie_code))?.libelle||'—'}`;
const person=id=>look(state.users,'id',id,'nom')||id||'—';
const canReview=r=>['finance','daf'].includes(state.user.role);
const mine=r=>r.demandeur_id===state.user.id;
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),5000)}
// Connexion directe Supabase : les requêtes utilisent les RLS en place.
// Aucune clé secrète ni token de reporting n'est contenu dans ce site.
function ensureClient(){
  if(!supabaseClient) throw Error('Librairie Supabase indisponible. Vérifiez la connexion Internet ou le bloqueur de scripts.');
  return supabaseClient;
}
function deniedWrite(){
  throw Error('Action temporairement désactivée : les règles de création, validation et décaissement côté serveur ne sont pas encore installées.');
}
async function readAll(table, orderBy){
  const c=ensureClient(), result=[], limit=500;
  for(let offset=0;offset<10000;offset+=limit){
    const {data,error}=await c.from(table).select('*').order(orderBy,{ascending:true}).range(offset,offset+limit-1);
    if(error)throw Error('Lecture '+table+' : '+error.message);
    result.push(...(data||[]));
    if(!data||data.length<limit) return result;
  }
  throw Error('Limite d’affichage atteinte pour '+table+'.');
}
async function getAppData(){
  const c=ensureClient();
  const {data:{user},error:authError}=await c.auth.getUser();
  if(authError||!user) throw Error('Connexion requise.');
  const {data:profile,error:profileError}=await c.from('utilisateurs')
    .select('id,auth_id,nom,email,role,actif').eq('auth_id',user.id).maybeSingle();
  if(profileError)throw Error('Profil DDC : '+profileError.message);
  if(!profile||profile.actif!==true)throw Error('Ce compte n’est pas lié à un profil DDC actif. Contactez la direction.');
  const [users,categories,accounts,subaccounts,projects,requests,proofs,history,returns,supplements]=await Promise.all([
    readAll('utilisateurs','id'),
    readAll('categories','code'),
    readAll('comptes','code'),
    readAll('sous_comptes','id_interne'),
    readAll('projets','id'),
    readAll('demandes','cree_le'),
    readAll('justificatifs','envoye_le'),
    readAll('historique','date'),
    readAll('restitutions','enregistre_le'),
    readAll('complements_financement','demande_le')
  ]);
  const owners = profile.role==='daf'
    ? categories.map(c=>String(c.code))
    : categories.filter(c=>String(c.responsables_ids||'').split(',').map(x=>x.trim()).includes(profile.id)).map(c=>String(c.code));
  return {user:profile,users,categories,accounts,subaccounts,projects,requests,proofs,history,returns,supplements,owners};
}
async function call(name,...params){
  if(name==='getAppData') return getAppData();
  if(name==='logout') {const {error}=await ensureClient().auth.signOut();if(error)throw Error(error.message);return {ok:true};}
  if(name==='createRequest') {
    const data=params[1];
    if(!data)throw Error('Formulaire de demande incomplet.');
    const {data:id,error}=await ensureClient().rpc('ddc_creer_demande',{
      p_projet:data.project,
      p_categorie:data.category,
      p_compte:data.account,
      p_sous_compte:data.sub||null,
      p_libelle:String(data.label||'').trim(),
      p_montant:Number(data.amount)
    });
    if(error)throw Error('Création de demande : '+error.message);
    if(!id)throw Error('Aucune référence de demande retournée.');
    return {id};
  }
  if(name==='addProject') {
    const {data:id,error}=await ensureClient().rpc('ddc_creer_projet',{
      p_nom:String(params[1]||'').trim()
    });
    if(error)throw Error('Création de projet : '+error.message);
    return {id};
  }
  if(name==='decideRequest') {
    const id=String(params[1]||'').trim();
    const decision=String(params[2]||'').trim();
    const comment=String(params[3]||'').trim();
    const {data:ref,error}=await ensureClient().rpc('ddc_decider_demande',{
      p_demande:id,
      p_decision:decision,
      p_commentaire:comment
    });
    if(error)throw Error('Décision financière : '+error.message);
    if(!ref)throw Error('Aucune référence de demande retournée.');
    toast(decision==='validee'?'Demande '+ref+' validée.':'Demande '+ref+' refusée.');
    return {id:ref,decision};
  }
  if(name==='disburseRequest') {
    const id=String(params[1]||'').trim();
    const mode=String(params[2]||'').trim();
    const {data:ref,error}=await ensureClient().rpc('ddc_decaisser_demande',{
      p_demande:id,
      p_mode_paiement:mode
    });
    if(error)throw Error('Décaissement : '+error.message);
    if(!ref)throw Error('Aucune référence de demande retournée.');
    toast('Décaissement intégral enregistré pour '+ref+'.');
    return {id:ref};
  }
  if(name==='uploadProof') {
    const id=String(params[1]||'').trim();
    const payload=params[2]||{};
    const file=payload.file;
    if(!(file instanceof File)) throw Error('Choisissez un fichier PDF ou une image.');
    if(!file.size || file.size>10*1024*1024) throw Error('Fichier vide ou supérieur à 10 Mo.');
    const ext=String(file.name.split('.').pop()||'').toLowerCase();
    const allowed={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'};
    if(!allowed[ext]||allowed[ext]!==file.type) throw Error('Seuls les fichiers PDF, JPG, PNG et WEBP sont acceptés.');
    if(file.name.length>200) throw Error('Nom de fichier trop long (200 caractères maximum).');
    if(!/^[-_A-Za-z0-9]+$/.test(id)) throw Error('Référence de demande incorrecte.');
    if(!crypto?.randomUUID) throw Error('Navigateur non compatible avec la création de références de fichiers.');
    const path=id+'/'+crypto.randomUUID()+'.'+ext;
    const db=ensureClient();
    const {error:uploadError}=await db.storage.from('ddc-justificatifs')
      .upload(path,file,{upsert:false,contentType:file.type,cacheControl:'0'});
    if(uploadError) throw Error('Envoi du fichier : '+uploadError.message);
    const {data:receiptId,error:registerError}=await db.rpc('ddc_enregistrer_justificatif',{
      p_demande:id,
      p_chemin:path,
      p_nom_fichier:file.name,
      p_mime_type:file.type,
      p_taille_octets:file.size,
      p_commentaire:String(payload.comment||'').trim()||null
    });
    if(registerError) throw Error('Fichier transmis, mais enregistrement du justificatif impossible : '+registerError.message+'. Signalez cette erreur à la direction.');
    toast('Justificatif enregistré.');
    return {id:receiptId};
  }
  if(name==='reviewProof') {
    const id=String(params[1]||'').trim();
    const decision=String(params[2]||'').trim();
    const amounts=params[3];
    const comment=String(params[4]||'').trim();
    const {data:ref,error}=await ensureClient().rpc('ddc_controler_justificatifs',{
      p_demande:id,
      p_decision:decision,
      p_montants:amounts,
      p_commentaire:comment
    });
    if(error)throw Error('Contrôle financier : '+error.message);
    if(!ref)throw Error('Aucune référence de demande retournée.');
    toast(decision==='conforme'?'Justificatifs conformes pour '+ref+'.':'Correction demandée pour '+ref+'.');
    return {id:ref,decision};
  }
  if(name==='returnFunds') {
    const id=String(params[1]||'').trim();
    const amount=Number(params[2]);
    const mode=String(params[3]||'').trim();
    const reference=String(params[4]||'').trim();
    const comment=String(params[5]||'').trim();
    if(!Number.isSafeInteger(amount)||amount<=0) throw Error('Montant de restitution invalide.');
    const {data:ref,error}=await ensureClient().rpc('ddc_enregistrer_restitution',{
      p_demande:id,p_montant:amount,p_mode:mode,p_reference:reference,p_commentaire:comment
    });
    if(error)throw Error('Restitution : '+error.message);
    if(!ref)throw Error('Référence de restitution non retournée.');
    toast('Retour de fonds enregistré pour '+id+'.');
    return {id:ref};
  }
  if(name==='requestSupplement') {
    const id=String(params[1]||'').trim(), amount=Number(params[2]), reason=String(params[3]||'').trim();
    if(!Number.isSafeInteger(amount)||amount<=0||amount>1000000000000)throw Error('Montant complémentaire invalide.');
    if(reason.length<10||reason.length>500)throw Error('Motif obligatoire : entre 10 et 500 caractères.');
    const {data:ref,error}=await ensureClient().rpc('ddc_demander_complement',{
      p_demande:id,p_montant:amount,p_motif:reason
    });
    if(error)throw Error('Demande complémentaire : '+error.message);
    if(!ref)throw Error('La référence du complément est manquante.');
    toast('Demande d’avance complémentaire envoyée pour validation.');
    return {id:ref};
  }
  if(name==='decideSupplement') {
    const ref=String(params[1]||'').trim(), decision=String(params[2]||'').trim(), note=String(params[3]||'').trim();
    const {data:id,error}=await ensureClient().rpc('ddc_decider_complement',{
      p_complement:ref,p_decision:decision,p_commentaire:note
    });
    if(error)throw Error('Décision sur complément : '+error.message);
    if(!id)throw Error('La référence du complément est manquante.');
    toast(decision==='validee'?'Avance complémentaire validée, pas encore décaissée.':'Avance complémentaire refusée.');
    return {id};
  }
  if(name==='disburseSupplement') {
    const ref=String(params[1]||'').trim(),mode=String(params[2]||'').trim(),reference=String(params[3]||'').trim();
    const {data:id,error}=await ensureClient().rpc('ddc_decaisser_complement',{
      p_complement:ref,p_mode_paiement:mode,p_reference:reference
    });
    if(error)throw Error('Décaissement complémentaire : '+error.message);
    if(!id)throw Error('La référence du complément est manquante.');
    toast('Décaissement complémentaire enregistré.');
    return {id};
  }
  if(name==='downloadProof') {
    const proofId=String(params[1]||'');
    const proof=state.proofs.find(p=>p.id===proofId);
    if(!proof) throw Error('Justificatif introuvable ou non autorisé.');
    const {data:blob,error}=await ensureClient().storage.from('ddc-justificatifs').download(proof.stockage_chemin);
    if(error) throw Error('Téléchargement : '+error.message);
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=proof.nom_fichier||'justificatif';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    return {ok:true};
  }
  return deniedWrite();
}

async function runAction(fn){if(busy)return;try{busyButton(true);await fn()}catch(e){toast(e.message||'Une erreur est survenue.',true);if(/Session expirée|Accès non autorisé|Connexion requise|Session invalide|Utilisateur non autorisé/i.test(e.message||'')){clearSession();showLogin()}}finally{busyButton(false)}}

// Les notifications représentent des actions en attente, calculées à partir des tables
// déjà lues sous RLS. Elles ne créent ni privilège ni donnée financière supplémentaire.
function getNotifications(){
  if(!state)return [];
  const fin=['finance','daf'].includes(state.user.role);
  const notices=[];
  const add=(n)=>notices.push(n);
  const allReturns=state.returns||[];
  const proofs=state.proofs||[];
  for(const r of state.requests){
    const owner=mine(r);
    const paid=r.decaissement==='decaisse';
    const ownName=person(r.demandeur_id);
    const title=String(r.libelle||'Demande de dépense');
    const rets=allReturns.filter(x=>x.demande_id===r.id).reduce((n,x)=>n+Number(x.montant_ariary||0),0);
    const balance=Number(r.montant_decaisse_ariary||0)-Number(r.montant_justifie_ariary||0)-rets;
    if(owner&&paid&&r.controle!=='conforme'){
      if(r.controle==='a_corriger'){
        add({id:'proof-correction:'+r.id,scope:'proofs',requestId:r.id,priority:1,actionable:true,title:'Justificatif à corriger',detail:`${title} · ${r.id}. Un contrôle a demandé une correction.${r.commentaire_controle?' Motif : '+r.commentaire_controle:''}`,amount:balance>0?balance:null,kind:'urgent',date:r.cree_le});
      } else if(r.justificatif!=='envoye'&&balance>0){
        add({id:'proof-missing:'+r.id,scope:'proofs',requestId:r.id,priority:1,actionable:true,title:'Justificatif à transmettre',detail:`${title} · ${r.id}. Il reste ${ar(balance)} à justifier ou restituer.`,kind:'urgent',date:r.cree_le});
      } else if(r.justificatif==='envoye'&&r.controle==='a_verifier'){
        add({id:'proof-checking:'+r.id,scope:'proofs',requestId:r.id,priority:6,actionable:false,title:'Justificatif en cours de contrôle',detail:`${title} · ${r.id}. Pièce envoyée : vérification financière en attente.`,kind:'info',date:r.cree_le});
      }
    }
    if(fin){
      if(r.validation==='en_cours'){
        add({id:'approval-request:'+r.id,scope:'approvals',requestId:r.id,priority:1,actionable:true,title:'Demande à valider',detail:`${ownName} · ${title} · ${ar(r.montant_ariary)}.`,kind:'urgent',date:r.cree_le});
      }
      if(r.validation==='validee'&&r.decaissement==='en_attente'){
        add({id:'finance-payout:'+r.id,scope:'finance',requestId:r.id,priority:2,actionable:true,title:'Décaissement à enregistrer',detail:`${ownName} · ${title} · ${ar(r.montant_ariary)}.`,kind:'pending',date:r.cree_le});
      }
      if(paid&&r.justificatif==='envoye'&&r.controle==='a_verifier'&&proofs.some(p=>p.demande_id===r.id)){
        add({id:'finance-review:'+r.id,scope:'finance',requestId:r.id,priority:1,actionable:true,title:'Justificatifs à contrôler',detail:`${ownName} · ${title} · ${r.id}.`,kind:'pending',date:r.cree_le});
      }
    }
  }
  if(fin){
    for(const c of state.supplements||[]){
      const r=byId(c.demande_id);
      if(!r||r.controle==='conforme')continue;
      if(c.statut==='en_attente'){
        add({id:'approval-supplement:'+c.id,scope:'approvals',requestId:r.id,priority:1,actionable:true,title:'Avance complémentaire à valider',detail:`${person(r.demandeur_id)} · ${r.id} · ${ar(c.montant_ariary)}. ${c.motif||''}`,kind:'urgent',date:c.demande_le});
      } else if(c.statut==='validee'){
        add({id:'finance-supplement:'+c.id,scope:'finance',requestId:r.id,priority:2,actionable:true,title:'Complément à décaisser',detail:`${person(r.demandeur_id)} · ${r.id} · ${ar(c.montant_ariary)}.`,kind:'pending',date:c.demande_le});
      }
    }
  }
  return notices.sort((a,b)=>a.priority-b.priority||String(b.date||'').localeCompare(String(a.date||'')));
}
function notificationCounts(items=getNotifications()){
  const action=items.filter(n=>n.actionable);
  return {all:action.length,proofs:action.filter(n=>n.scope==='proofs').length,approvals:action.filter(n=>n.scope==='approvals').length,finance:action.filter(n=>n.scope==='finance').length};
}
function notificationItem(n){
  return `<button type="button" class="n-item" data-open="${esc(n.requestId)}" aria-label="Ouvrir ${esc(n.title)} pour ${esc(n.requestId)}"><span class="n-marker ${n.kind==='urgent'?'urgent':''}" aria-hidden="true">${n.scope==='proofs'?'▤':n.scope==='approvals'?'✓':'◈'}</span><span class="n-body"><b>${esc(n.title)}</b><p>${esc(n.detail)}</p><span class="n-meta">${badge(n.actionable?'en_attente':'a_verifier')}<span class="mini muted">${esc(n.requestId)} · ${dateText(n.date)}</span></span></span><span class="n-arrow" aria-hidden="true">›</span></button>`;
}
function notificationSection(label,subtitle,items,emptyText){
  return `<section class="panel n-section"><div class="phead"><div><h2>${esc(label)} <span class="badge info" style="margin-left:7px">${items.filter(x=>x.actionable).length} à traiter</span></h2><div class="mini muted">${esc(subtitle)}</div></div></div>${items.length?`<div class="n-list">${items.map(notificationItem).join('')}</div>`:`<div class="n-empty"><strong>Tout est à jour</strong>${esc(emptyText)}</div>`}</section>`;
}
function notificationsPage(type='notifications'){
  const items=getNotifications(),counts=notificationCounts(items),fin=['finance','daf'].includes(state.user.role);
  const title={notifications:'Centre de notifications',proofs:'Mes justificatifs',approvals:'Demandes à valider',financeTasks:'Opérations financières'}[type]||'Notifications';
  const intro='Alertes calculées depuis les dossiers Supabase visibles par votre compte. Ouvrez une ligne pour agir dans le dossier.';
  let content='';
  if(type==='notifications'){
    content=`<div class="notification-overview"><article class="n-summary"><div><b>Justificatifs</b><small>Mes pièces à transmettre ou corriger</small></div><strong>${counts.proofs}</strong></article><article class="n-summary"><div><b>Validations</b><small>Demandes et compléments</small></div><strong>${counts.approvals}</strong></article><article class="n-summary"><div><b>Opérations financières</b><small>Décaissements et contrôles</small></div><strong>${counts.finance}</strong></article></div>`;
    content+=notificationSection('Mes justificatifs','Dossiers à régulariser et documents envoyés',items.filter(x=>x.scope==='proofs'),'Aucun justificatif en attente.');
    if(fin){content+=notificationSection('À valider','Demandes et avances complémentaires',items.filter(x=>x.scope==='approvals'),'Aucune validation en attente.');content+=notificationSection('À décaisser / contrôler','Décaissements et justificatifs financiers',items.filter(x=>x.scope==='finance'),'Aucune opération financière en attente.');}
  }else if(type==='proofs'){

    content=notificationSection('À transmettre ou corriger','Ces dossiers nécessitent votre intervention',todo,'Aucune pièce manquante sur vos demandes.');
    content+=notificationSection('En attente du contrôle','Justificatifs déjà transmis',progress,'Aucun justificatif en attente de vérification.');
  }else if(type==='approvals'){
    content=notificationSection('Demandes à valider','Demandes initiales et avances complémentaires',fin?items.filter(x=>x.scope==='approvals'):[],'Aucune demande à valider.');
  }else if(type==='financeTasks'){
    content=notificationSection('Décaissements et contrôles','Paiements à enregistrer et justificatifs à contrôler',fin?items.filter(x=>x.scope==='finance'):[],'Aucune opération financière en attente.');
  }
  return `${heading('Suivi des actions',title,intro,`<button type="button" class="btn soft" data-refresh>⟳ Actualiser</button>`)}<div class="notice-tags"><span class="mini-tag">● ${counts.all} action${counts.all>1?'s':''} en attente</span><span class="mini-tag">↻ Vérification automatique toutes les 2 minutes</span></div>${content}`;
}
async function refreshNotifications(force=false){
  if(!state||(!force&&busy)||document.hidden||document.querySelector('#dialogLayer'))return false;
  // Ne jamais effacer un formulaire en cours de saisie lors du rafraîchissement automatique.
  if(!force&&(view==='new'||document.activeElement?.matches?.('input,textarea,select')))return false;
  try{const oldId=state.user.id;const fresh=await getAppData();if(fresh.user.id===oldId){state=fresh;lastRefreshAt=Date.now();render();return true;}}
  catch(e){console.warn('Actualisation des notifications :',e.message||e);if(force)throw e;}
  return false;
}

  $('[data-menu]')?.addEventListener('click',()=>{navOpen=!navOpen;render()});
  $('[data-closemenu]')?.addEventListener('click',()=>{navOpen=false;render()});
  $('[data-logout]').onclick=()=>runAction(async()=>{await call('logout',token);clearSession();showLogin();toast('Vous êtes déconnecté.')});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.open)));
  if(view==='new')wireNew();if(view==='requests')wireSearch();
  $('[data-addproject]')?.addEventListener('click',()=>createProjectPrompt());
}
function heading(k,title,desc,extra=''){return `<section class="pageheading"><div><div class="caps">${esc(k)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${extra}</section>`}
function stats(){const r=state.requests;const amount=r.filter(x=>x.validation==='validee').reduce((s,x)=>s+Number(x.montant_ariary||0),0)+(state.supplements||[]).filter(x=>['validee','decaissee'].includes(x.statut)).reduce((s,x)=>s+Number(x.montant_ariary||0),0);return [{label:'Demandes',value:r.length,desc:'Dossiers visibles'},{label:'En attente de validation',value:r.filter(x=>x.validation==='en_cours').length,desc:'À traiter'},{label:'Total validé',value:ar(amount),desc:'Initial + compléments approuvés'},{label:'Justificatifs à vérifier',value:r.filter(x=>x.controle==='a_verifier').length,desc:'Contrôle restant'}].map(c=>`<article class="stat"><label>${esc(c.label)}</label><strong style="font-size:${String(c.value).length>12?'19':'26'}px">${esc(c.value)}</strong><small>${esc(c.desc)}</small></article>`).join('')}
function dashboardPage(){const isFin=['finance','daf'].includes(state.user.role);const pending=getNotifications().filter(n=>n.actionable);const priority=pending.length?`<section class="panel n-section"><div class="phead"><div><h2>Actions à traiter <span class="badge pending" style="margin-left:7px">${pending.length}</span></h2><div class="mini muted">Notifications liées à votre rôle</div></div><button class="btn small soft" data-go="notifications">Voir tout</button></div><div class="n-list">${pending.slice(0,3).map(notificationItem).join('')}</div></section>`:'';const latest=[...state.requests].sort((a,b)=>String(b.cree_le).localeCompare(String(a.cree_le))).slice(0,7);return `<section class="hero"><div><div class="caps bright">Espace ${isFin?'financier':'production'}</div><h2>Bonjour ${esc(state.user.nom)}.</h2><p>${isFin?'Validez les dépenses, suivez les décaissements et contrôlez les justificatifs dans un seul espace.':'Déposez vos demandes par compte budgétaire et suivez chaque étape jusqu’au contrôle final.'}</p></div><button class="btn" data-go="new">＋ Nouvelle demande</button></section>${priority}<section class="stats">${stats()}</section><section class="panel"><div class="phead"><div><h2>Demandes récentes</h2><div class="mini muted">Votre suivi sécurisé depuis Supabase</div></div><button class="btn small" data-go="requests">Tout afficher</button></div>${requestTables(latest)}</section>${state.user.role==='daf'?`<div style="margin-top:18px" class="notice">Vous pouvez ajouter un tournage à tout moment : <button class="btn small soft" data-addproject>＋ Ajouter un projet</button></div>`:''}`}
function requestTables(data){if(!data.length)return '<div class="empty"><strong>Aucune demande pour le moment</strong><p>Les nouvelles demandes enregistrées dans Supabase apparaîtront ici.</p></div>';const header='<thead><tr><th>Référence / demande</th><th>Demandeur</th><th>Compte</th><th>Montant initial</th><th>Validation</th><th>Décaissement</th><th>Justificatif</th></tr></thead>';const body=data.map(r=>`<tr data-id="${esc(r.id)}" data-open="${esc(r.id)}"><td><b>${esc(r.id)}</b><div class="muted tiny">${esc(r.libelle)}</div></td><td>${esc(person(r.demandeur_id))}</td><td>${esc(r.compte_code)}</td><td><b>${esc(ar(r.montant_ariary))}</b></td><td>${badge(r.validation)}</td><td>${badge(r.decaissement)}</td><td>${badge(r.justificatif)}</td></tr>`).join('');const mobile=data.map(r=>`<article class="req-card" data-open="${esc(r.id)}"><div class="line"><div><b>${esc(r.id)}</b><div class="tiny muted">${esc(person(r.demandeur_id))} · ${esc(r.compte_code)}</div></div><b>${esc(ar(r.montant_ariary))}</b></div><p>${esc(r.libelle)}</p><div class="foot">${badge(r.validation)}${badge(r.decaissement)}${badge(r.justificatif)}</div></article>`).join('');return `<div class="table-scroll"><table>${header}<tbody>${body}</tbody></table></div><div class="listcards" style="padding:12px">${mobile}</div>`}
function requestsPage(){let data=[...state.requests].sort((a,b)=>String(b.cree_le).localeCompare(String(a.cree_le)));if(search){const q=search.toLowerCase();data=data.filter(r=>[r.id,r.libelle,person(r.demandeur_id),r.compte_code,catName(r)].join(' ').toLowerCase().includes(q))}if(filter!=='all')data=data.filter(r=>r.validation===filter||r.decaissement===filter||r.controle===filter);return `${heading('Traçabilité','Toutes les demandes','Consultez les décisions, décaissements et justificatifs.',`<button class="btn primary" data-go="new">＋ Nouvelle demande</button>`)}<div class="toolbar"><input id="searchReq" class="control" placeholder="Rechercher un numéro, un compte, un libellé…" value="${esc(search)}"><select class="control" id="filterReq"><option value="all">Tous les statuts</option><option value="en_cours" ${filter==='en_cours'?'selected':''}>Validation en cours</option><option value="validee" ${filter==='validee'?'selected':''}>Validées</option><option value="refusee" ${filter==='refusee'?'selected':''}>Refusées</option><option value="decaisse" ${filter==='decaisse'?'selected':''}>Décaissées</option><option value="a_verifier" ${filter==='a_verifier'?'selected':''}>Justificatifs à vérifier</option></select></div><div class="panel">${requestTables(data)}</div>`}
function wireSearch(){const q=$('#searchReq');q?.addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('#searchReq')?.focus();$('#searchReq')?.setSelectionRange(pos,pos)});$('#filterReq')?.addEventListener('change',e=>{filter=e.target.value;render()})}
function newPage(){const allowed=state.categories.filter(c=>state.owners.includes(c.code));if(!allowed.length)return heading('Nouvelle dépense','Accès non attribué','Demandez à Mamihasina de vous attribuer une catégorie dans la configuration DDC.');return `${heading('Saisie','Nouvelle demande','Catégorie → compte → sous-compte (si nécessaire) → libellé → montant.') }<section class="panel" style="max-width:810px"><div class="phead"><div><h2>Informations de dépense</h2><div class="mini muted">Demandeur : ${esc(state.user.nom)}</div></div></div><form id="newForm" class="pbody"><div class="formgrid"><div class="field"><label>Projet de production *</label><select required class="control" id="project"><option value="">Choisir un projet</option>${state.projects.filter(p=>p.actif).map(p=>`<option value="${esc(p.id)}">${esc(p.nom)}</option>`).join('')}</select></div><div class="field"><label>Catégorie de dépense *</label><select required class="control" id="category"><option value="">Choisir une catégorie</option>${allowed.map(c=>`<option value="${esc(c.code)}">${esc(c.code+' · '+c.libelle)}</option>`).join('')}</select></div><div class="field"><label>Compte concerné *</label><select required class="control" id="account" disabled><option value="">Choisir d’abord la catégorie</option></select></div><div class="field" id="subField" style="display:none"><label>Sous-compte *</label><select class="control" id="sub"></select><span class="mini muted">Les codes 612 et 622 conservent leurs libellés distincts.</span></div><div class="field wide"><label>Libellé — motif de la dépense *</label><textarea class="control" id="label" placeholder="Exemple : location véhicule pour le déplacement de l'équipe du tournage" maxlength="400" required></textarea></div><div class="field"><label>Montant demandé en Ariary *</label><input class="control" id="amount" type="number" min="1" step="1" max="1000000000000" placeholder="350000" required></div><div class="field"><label>Récapitulatif</label><div style="padding:12px;border-radius:12px;background:#f3f8f7"><span class="mini muted">Montant de la demande</span><div class="price" id="amountPreview">0 Ar</div></div></div></div><div class="formfoot"><span class="mini muted">La demande sera soumise à Roger ou Mamihasina pour validation.</span><button class="btn primary" data-submit type="submit">Soumettre la demande</button></div></form></section>`}
function wireNew(){const c=$('#category'),a=$('#account'),s=$('#sub');if(!c)return;c.onchange=()=>{const accounts=state.accounts.filter(x=>String(x.categorie_code)===c.value);a.disabled=!c.value;a.innerHTML='<option value="">Choisir un compte</option>'+accounts.map(x=>`<option value="${esc(x.code)}">${esc(x.code+' · '+x.libelle)}</option>`).join('');s.innerHTML='';$('#subField').style.display='none'};a.onchange=()=>{const subs=state.subaccounts.filter(x=>String(x.categorie_code)===c.value&&String(x.compte_code)===a.value);$('#subField').style.display=subs.length?'flex':'none';s.required=!!subs.length;s.innerHTML='<option value="">Choisir un sous-compte</option>'+subs.map(x=>`<option value="${esc(x.id_interne)}">${esc(x.code_affiche+' · '+x.libelle)}</option>`).join('')};$('#amount').oninput=e=>$('#amountPreview').textContent=ar(e.target.value);$('#newForm').onsubmit=e=>{e.preventDefault();runAction(async()=>{const data={project:$('#project').value,category:c.value,account:a.value,sub:$('#subField').style.display==='none'?'':s.value,label:$('#label').value,amount:$('#amount').value};const result=await call('createRequest',token,data);toast('Demande '+result.id+' enregistrée.');view='requests';await load()})}}
function closeDialog(){selection=null;document.querySelector('#dialogLayer')?.remove()}
function openDetail(id){const r=byId(id);if(!r)return;selection=id;const sub=state.subaccounts.find(x=>x.id_interne===r.sous_compte_id);const proofs=state.proofs.filter(p=>p.demande_id===id);const returns=(state.returns||[]).filter(x=>x.demande_id===id);const supplements=(state.supplements||[]).filter(x=>x.demande_id===id);const supplementOpen=supplements.find(x=>['en_attente','validee'].includes(x.statut));const supplementApproved=supplements.filter(x=>['validee','decaissee'].includes(x.statut)).reduce((n,x)=>n+Number(x.montant_ariary||0),0);const returned=returns.reduce((sum,x)=>sum+Number(x.montant_ariary||0),0);const history=state.history.filter(h=>h.demande_id===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const buttons=[];
  if(canReview(r)&&r.validation==='en_cours'){buttons.push('<button class="btn primary" data-action="approve">✓ Valider</button>');if(!mine(r))buttons.push('<button class="btn danger" data-action="reject">Refuser</button>')}
  if(canReview(r)&&r.validation==='validee'&&r.decaissement==='en_attente'){buttons.push('<button class="btn primary" data-action="pay">Enregistrer le décaissement</button>')}
  if(canReview(r)&&r.decaissement==='decaisse'&&r.controle!=='conforme'&&returned<Number(r.montant_decaisse_ariary||0)){buttons.push('<button class="btn soft" data-action="return">Enregistrer un retour de fonds</button>')}
  if(mine(r)&&r.decaissement==='decaisse'&&r.controle!=='conforme'&&!supplementOpen){buttons.push('<button class="btn soft" data-action="requestSupplement">＋ Demander une avance complémentaire</button>')}
  if(mine(r)&&r.decaissement==='decaisse'&&r.controle!=='conforme'){buttons.push('<button class="btn primary" data-action="proof">+ Ajouter un justificatif</button>')}
  if(canReview(r)&&r.decaissement==='decaisse'&&r.justificatif==='envoye'&&r.controle==='a_verifier'&&proofs.length){
    buttons.push('<button class="btn primary" data-action="compliant">✓ Marquer conforme</button>','<button class="btn danger" data-action="correction">Demander une correction</button>');
  }
  const detail=`<div class="overlay" id="dialogLayer" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="dhead"><div><div class="caps">Dossier de dépense</div><h2 id="detailTitle">${esc(r.id)}</h2></div><button class="close" data-close aria-label="Fermer">×</button></div><div class="dbody"><div style="display:flex;align-items:start;justify-content:space-between;gap:15px"><div><b style="font-size:16px">${esc(r.libelle)}</b><div class="mini muted">${esc(person(r.demandeur_id))} · ${dateText(r.cree_le)}</div></div><div class="price">${esc(ar(r.montant_ariary))}</div></div><div class="detailgrid"><div><div class="lab">Projet</div><strong>${esc(look(state.projects,'id',r.projet_id,'nom'))}</strong></div><div><div class="lab">Catégorie</div><strong>${esc(catName(r))}</strong></div><div><div class="lab">Compte</div><strong>${esc(accountName(r))}</strong></div><div><div class="lab">Sous-compte</div><strong>${esc(sub?sub.code_affiche+' · '+sub.libelle:'—')}</strong></div></div><div class="stepgrid"><div class="step"><small>Validation</small>${badge(r.validation)}</div><div class="step"><small>Décaissement</small>${badge(r.decaissement)}</div><div class="step"><small>Justificatif</small>${badge(r.justificatif)}</div><div class="step"><small>Contrôle</small>${badge(r.controle)}</div></div>${r.decaissement==='decaisse'?`<div class="notice"><b>Décaissement initial :</b> ${esc(ar(r.montant_ariary))} · ${esc(r.mode_paiement||'Mode non renseigné')} · ${dateText(r.decaisse_le)}</div>`:''}${r.decaissement==='decaisse'?`<div class="notice" style="margin-top:8px"><b>Budget initial approuvé :</b> ${esc(ar(r.montant_ariary))} · <b>Compléments approuvés :</b> ${esc(ar(supplementApproved))} · <b>Budget total approuvé :</b> ${esc(ar(Number(r.montant_ariary||0)+supplementApproved))} · <b>Total effectivement décaissé :</b> ${esc(ar(r.montant_decaisse_ariary))}</div>`:''}${r.decaissement==='decaisse'?`<div class="notice" style="margin-top:8px"><b>Fonds restitués :</b> ${esc(ar(returned))} · <b>Reste à justifier ou restituer :</b> ${esc(ar(Number(r.montant_decaisse_ariary||0)-Number(r.montant_justifie_ariary||0)-returned))}</div>`:''}${returns.length?`<div class="mini muted" style="margin-top:8px">${returns.map(x=>`Retour du ${dateText(x.enregistre_le)} : ${esc(ar(x.montant_ariary))} · ${esc(x.mode_restitution)}`).join(' / ')}</div>`:''}${r.montant_justifie_ariary!==null && r.montant_justifie_ariary!==undefined?`<div class="notice" style="margin-top:8px"><b>Montant justifié vérifié :</b> ${esc(ar(r.montant_justifie_ariary))} · <b>Solde après retours :</b> ${esc(ar(Number(r.montant_decaisse_ariary||0)-Number(r.montant_justifie_ariary||0)-returned))}</div>`:''}${r.motif_decision?`<div class="notice warn"><b>Décision :</b> ${esc(r.motif_decision)}</div>`:''}${r.commentaire_controle?`<div class="notice warn" style="margin-top:8px"><b>Contrôle :</b> ${esc(r.commentaire_controle)}</div>`:''}<div class="actions">${buttons.join('')}<span class="mini muted">${esc(PHASE_TEST)}</span></div><div class="rule"></div><h3 style="font-size:14px">Avances complémentaires (${supplements.length})</h3>${supplements.length?supplements.map(c=>`<div class="attachment" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>${esc(ar(c.montant_ariary))}</b>${badgeSupplement(c.statut)}</div><div class="mini muted" style="margin-top:6px">Demandé le ${dateText(c.demande_le)} par ${esc(person(c.demande_par))} · ${esc(c.motif)}</div>${c.commentaire_decision?`<div class="mini muted" style="margin-top:5px">Décision : ${esc(c.commentaire_decision)}</div>`:''}${c.statut==='decaissee'?`<div class="mini muted" style="margin-top:5px">Décaissement : ${dateText(c.decaisse_le)} · ${esc(c.mode_paiement||'—')}${c.reference_paiement?' · Réf. '+esc(c.reference_paiement):''}</div>`:''}${canReview(r)&&r.controle!=='conforme'&&c.statut==='en_attente'?`<div class="actions"><button class="btn primary small" data-supplement-action="approve" data-supplement-id="${esc(c.id)}">✓ Valider le complément</button>${mine(r)?'':`<button class="btn danger small" data-supplement-action="reject" data-supplement-id="${esc(c.id)}">Refuser</button>`}</div>`:''}${canReview(r)&&r.controle!=='conforme'&&c.statut==='validee'?`<div class="actions"><button class="btn primary small" data-supplement-action="pay" data-supplement-id="${esc(c.id)}">Enregistrer le décaissement complémentaire</button></div>`:''}</div>`).join(''):'<p class="mini muted">Aucune avance complémentaire demandée.</p>'}<div class="rule"></div><h3 style="font-size:14px">Justificatifs (${proofs.length})</h3>${proofs.length?proofs.map(p=>`<button type="button" class="attachment" data-proof="${esc(p.id)}" style="width:100%;text-align:left;cursor:pointer" title="Télécharger le justificatif">📎 <span>${esc(p.nom_fichier)}</span><span class="tiny muted"> · ${dateText(p.envoye_le)}</span>${p.montant_justifie_ariary!==null&&p.montant_justifie_ariary!==undefined?` <span class="tiny muted"> · Montant vérifié : ${esc(ar(p.montant_justifie_ariary))}</span>`:''} <span class="mini muted">↓ Télécharger</span></button>`).join(''):'<p class="mini muted">Aucun justificatif transmis.</p>'}<div class="rule"></div><h3 style="font-size:14px">Historique des opérations</h3>${history.map(h=>`<div class="historyrow"><b>${esc(h.action.replaceAll('_',' '))}</b> · <span class="mini muted">${esc(person(h.acteur_id))}</span><small>${dateText(h.date)}${h.commentaire?' · '+esc(h.commentaire):''}</small></div>`).join('')||'<p class="mini muted">Aucune opération.</p>'}</div></div></div>`;
  document.body.insertAdjacentHTML('beforeend',detail);
  $('[data-close]').onclick=closeDialog;
  $('#dialogLayer').addEventListener('click',e=>{if(e.target.id==='dialogLayer')closeDialog()});
  document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>startAction(b.dataset.action,r)));
  document.querySelectorAll('[data-supplement-action]').forEach(b=>b.addEventListener('click',()=>startSupplementAction(b.dataset.supplementAction,b.dataset.supplementId,r)));
  document.querySelectorAll('[data-proof]').forEach(b=>b.addEventListener('click',()=>runAction(()=>call('downloadProof',token,b.dataset.proof))));
}
function badgeSupplement(status){const config={en_attente:['En attente','pending'],validee:['Validée · non décaissée','info'],refusee:['Refusée','no'],decaissee:['Décaissée','ok']};const [name,kind]=config[status]||[status,''];return `<span class="badge ${kind}">${esc(name)}</span>`}
function safeHttpUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function actionModal(title,inner,submitText,handler){const dialog=$('#dialogLayer .dialog');dialog.innerHTML=`<div class="dhead"><div><div class="caps">${esc(selection)}</div><h2>${esc(title)}</h2></div><button class="close" data-close aria-label="Fermer">×</button></div><div class="dbody"><form id="actionForm" class="dialogform">${inner}<button class="btn primary" data-submit type="submit">${esc(submitText)}</button></form></div>`;dialog.querySelector('[data-close]').onclick=closeDialog;$('#actionForm').onsubmit=e=>{e.preventDefault();runAction(async()=>{await handler();closeDialog();await load()})}}
function accordExterneForm(){
  const other=state.user.id==='roger'?'Mamihasina':'Roger';
  return `<div class="notice warn"><b>Accord préalable hors application</b> — vous validez votre propre demande. Vous déclarez avoir obtenu l’accord de ${esc(other)} avant cette validation. La déclaration sera conservée dans l’historique ; elle ne constitue pas une signature de ${esc(other)}.</div><div class="field"><label>Accord préalable déclaré avec</label><input class="control" type="text" value="${esc(other)}" disabled></div><div class="field"><label>Date de l’accord (obligatoire)</label><input class="control" id="accordDate" type="date" required></div><div class="field"><label>Commentaire (facultatif, 180 caractères max.)</label><textarea class="control" id="accordComment" maxlength="180" placeholder="Contexte / référence de l’accord"></textarea></div><div class="field"><label><input id="accordConfirme" type="checkbox" required> Je confirme avoir obtenu cet accord en dehors de l’application.</label></div>`;
}
function approbationCommentaire(r,usualSelector){
  if(!mine(r))return $(usualSelector).value;
  if(!$('#accordConfirme')?.checked)throw Error('Vous devez confirmer avoir obtenu l’accord hors application.');
  const date=$('#accordDate')?.value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))throw Error('Date de l’accord préalable requise.');
  const other=state.user.id==='roger'?'mamihasina':'roger';
  return JSON.stringify({type:'accord_hors_app',avec:other,date,commentaire:$('#accordComment')?.value.trim()||''});
}
function startAction(type,r){const id=r.id;if(type==='approve')return actionModal('Valider cette dépense',mine(r)?accordExterneForm():'<p class="mini muted">Une seule approbation suffit. Cette action ne déclenche pas le décaissement.</p><div class="field"><label>Commentaire (facultatif)</label><textarea class="control" id="note"></textarea></div>','Valider',()=>call('decideRequest',token,id,'validee',approbationCommentaire(r,'#note')));if(type==='reject'){if(mine(r))throw Error('Vous ne pouvez pas refuser votre propre demande.');return actionModal('Refuser cette demande','<div class="field"><label>Motif du refus *</label><textarea class="control" id="note" required></textarea></div>','Confirmer le refus',()=>call('decideRequest',token,id,'refusee',$('#note').value));}if(type==='pay')return actionModal('Enregistrer le décaissement',`<div class="notice">Montant validé : <b>${esc(ar(r.montant_ariary))}</b>. Le suivi de cette version concerne le paiement intégral de la demande.</div><div class="field"><label>Mode de paiement</label><select class="control" id="payMode"><option>Espèces</option><option>Virement</option><option>Mobile Money</option><option>Autre</option></select></div>`,'Confirmer le décaissement',()=>call('disburseRequest',token,id,$('#payMode').value));if(type==='return'){
  const totalReturned=(state.returns||[]).filter(x=>x.demande_id===id).reduce((sum,x)=>sum+Number(x.montant_ariary||0),0);
  const left=Number(r.montant_decaisse_ariary||0)-totalReturned;
  const inner=`<div class="notice"><b>Retour de fonds à DDC :</b> enregistrez uniquement une somme effectivement récupérée. Montant encore non restitué : ${esc(ar(left))}. Cette opération ne déclenche pas de transfert réel.</div><div class="field"><label>Montant restitué (Ar) *</label><input class="control" id="refundAmount" inputmode="numeric" type="number" min="1" max="${left}" step="1" required></div><div class="field"><label>Mode de restitution</label><select class="control" id="refundMode"><option>Espèces</option><option>Virement</option><option>Mobile Money</option><option>Autre</option></select></div><div class="field"><label>Référence du reçu (facultatif)</label><input class="control" id="refundRef" maxlength="120" placeholder="Référence de remise / virement"></div><div class="field"><label>Commentaire (facultatif)</label><textarea class="control" id="refundNote" maxlength="500"></textarea></div>`;
  return actionModal('Enregistrer un retour de fonds',inner,'Confirmer la réception',()=>{
    const amount=Number($('#refundAmount').value);
    if(!Number.isSafeInteger(amount)||amount<=0||amount>left)throw Error('Montant de restitution incorrect.');
    return call('returnFunds',token,id,amount,$('#refundMode').value,$('#refundRef').value,$('#refundNote').value);
  });
}if(type==='requestSupplement'){
  const available=1000000000000-Number(r.montant_decaisse_ariary||0);
  const inner=`<div class="notice">L’avance supplémentaire doit être justifiée, puis validée par Roger ou Mamihasina avant tout décaissement. Elle ne déclenche aucun transfert automatique.</div><div class="field"><label>Montant demandé (Ar) *</label><input class="control" id="supplementAmount" type="number" min="1" max="${available}" step="1" required></div><div class="field"><label>Motif (10 caractères minimum) *</label><textarea class="control" id="supplementReason" required minlength="10" maxlength="500" placeholder="Dépenses complémentaires de transport pendant le tournage…"></textarea></div>`;
  return actionModal('Demander une avance complémentaire',inner,'Envoyer la demande',()=>{
    const amount=Number($('#supplementAmount').value);
    if(!Number.isSafeInteger(amount)||amount<=0||amount>available)throw Error('Montant supplémentaire incorrect.');
    return call('requestSupplement',token,id,amount,$('#supplementReason').value);
  });
}if(type==='compliant'||type==='correction')return openFinancialReview(type,r);if(type==='proof')return actionModal('Envoyer un justificatif','<div class="notice">Le justificatif sera conservé dans le stockage privé Supabase, visible uniquement par son demandeur et les responsables financiers.</div><div class="field"><label>Fichier PDF ou image (10 Mo maximum) *</label><input class="control" type="file" id="file" accept=".pdf,.jpg,.jpeg,.png,.webp" required></div><div class="field"><label>Commentaire (facultatif)</label><textarea class="control" id="fileNote" maxlength="500" placeholder="Référence de facture, détails…"></textarea></div>','Envoyer le justificatif',async()=>{const f=$('#file').files[0];if(!f)throw Error('Sélectionnez un fichier.');await call('uploadProof',token,id,{file:f,comment:$('#fileNote').value})})}
function startSupplementAction(type,supplementId,r){
  const supplement=(state.supplements||[]).find(c=>c.id===supplementId&&c.demande_id===r.id);
  if(!supplement){toast('Complément introuvable. Actualisez la page.',true);return}
  if(!canReview(r)||r.controle==='conforme'){toast('Opération non autorisée sur cette demande.',true);return}
  if(type==='approve'&&supplement.statut==='en_attente'){
    const content=mine(r)?accordExterneForm():`<div class="notice">Avance demandée par ${esc(person(supplement.demande_par))} : <b>${esc(ar(supplement.montant_ariary))}</b>. La validation n’effectue aucun paiement.</div><div class="field"><label>Commentaire (facultatif)</label><textarea class="control" id="supplementNote" maxlength="500"></textarea></div>`;
    return actionModal('Valider l’avance complémentaire',content,'Valider le complément',()=>call('decideSupplement',token,supplementId,'validee',approbationCommentaire(r,'#supplementNote')));
  }
  if(type==='reject'&&supplement.statut==='en_attente'){
    if(mine(r))throw Error('Vous ne pouvez pas refuser votre propre avance complémentaire.');
    const content=`<div class="field"><label>Motif du refus (obligatoire) *</label><textarea class="control" id="supplementNote" maxlength="500" minlength="5" required></textarea></div>`;
    return actionModal('Refuser l’avance complémentaire',content,'Confirmer le refus',()=>call('decideSupplement',token,supplementId,'refusee',$('#supplementNote').value));
  }
  if(type==='pay'&&supplement.statut==='validee'){
    const content=`<div class="notice">Montant validé : <b>${esc(ar(supplement.montant_ariary))}</b>. Confirmez seulement lorsque les fonds ont réellement été remis. Aucun virement n’est exécuté par l’application.</div><div class="field"><label>Mode de paiement *</label><select class="control" id="supplementPayMode"><option>Espèces</option><option>Virement</option><option>Mobile Money</option><option>Autre</option></select></div><div class="field"><label>Référence du paiement (facultatif)</label><input class="control" id="supplementPayRef" maxlength="120" placeholder="N° reçu, virement…"></div>`;
    return actionModal('Décaisser l’avance complémentaire',content,'Enregistrer le décaissement',()=>call('disburseSupplement',token,supplementId,$('#supplementPayMode').value,$('#supplementPayRef').value));
  }
  toast('Cette avance a déjà changé de statut. Actualisez la page.',true);
}
// Contrôle des justificatifs : la validation finale reste soumise aux vérifications SQL.
function openFinancialReview(type,r){
  const docs=state.proofs.filter(p=>p.demande_id===r.id);
  if(!docs.length){toast('Aucun justificatif à contrôler.',true);return}
  const payout=Number(r.montant_decaisse_ariary||0);
  const returned=(state.returns||[]).filter(x=>x.demande_id===r.id).reduce((sum,x)=>sum+Number(x.montant_ariary||0),0);
  const isCompliant=type==='compliant';
  if(isCompliant&&(state.supplements||[]).some(c=>c.demande_id===r.id&&['en_attente','validee'].includes(c.statut))){toast('Avance complémentaire en attente de décision ou de paiement : clôture Conforme impossible.',true);return}
  const fields=docs.map((p,i)=>`<div class="field"><label>Pièce ${i+1} · ${esc(p.nom_fichier)}</label><button class="btn small soft" type="button" data-review-download="${esc(p.id)}">↓ Télécharger pour vérification</button><input class="control" type="number" min="0" step="1" max="1000000000000" data-proof-amount="${esc(p.id)}" placeholder="Montant accepté en ariary" value="${p.montant_justifie_ariary===null||p.montant_justifie_ariary===undefined?'':esc(p.montant_justifie_ariary)}" required></div>`).join('');
  const inner=`<div class="notice"><b>Montant décaissé :</b> ${esc(ar(payout))}. <b>Déjà restitué :</b> ${esc(ar(returned))}. Vérifiez les montants acceptés : justificatifs + restitutions doivent couvrir exactement le décaissement pour valider « Conforme ».</div>${fields}<div class="notice" id="reviewBalance" aria-live="polite">Total vérifié : —</div><div class="field"><label>${isCompliant?'Commentaire (facultatif)':'Motif de correction (obligatoire, 5 caractères minimum)'}</label><textarea class="control" id="note" maxlength="1000" ${isCompliant?'':'required minlength="5"'} placeholder="${isCompliant?'Référence ou vérification effectuée':'Exemple : reçu insuffisant ou solde non régularisé'}"></textarea></div>`;
  actionModal(isCompliant?'Contrôle des pièces · Conforme':'Contrôle des pièces · À corriger',inner,isCompliant?'Valider le contrôle':'Demander la correction',async()=>{
    const values={},inputs=[...document.querySelectorAll('#actionForm [data-proof-amount]')];
    let total=0;
    if(inputs.length!==docs.length)throw Error('La liste des justificatifs a changé. Actualisez la page.');
    for(const input of inputs){
      const raw=input.value.trim();
      if(!/^\d+$/.test(raw))throw Error('Renseignez un montant entier pour chaque justificatif.');
      const amount=Number(raw);
      if(!Number.isSafeInteger(amount)||amount<0||amount>1000000000000)throw Error('Montant de justificatif incorrect.');
      values[input.dataset.proofAmount]=amount;
      total+=amount;
    }
    if(isCompliant&&total+returned!==payout)throw Error('Justifié ('+ar(total)+') + restitué ('+ar(returned)+') doit égaler le décaissement ('+ar(payout)+'). Sinon, demandez une correction.');
    return call('reviewProof',token,r.id,isCompliant?'conforme':'a_corriger',values,$('#note').value);
  });
  const updateBalance=()=>{
    const inputs=[...document.querySelectorAll('#actionForm [data-proof-amount]')];
    const total=inputs.reduce((v,e)=>v+(Number(e.value)||0),0);
    const gap=payout-total-returned;
    $('#reviewBalance').textContent='Justifié : '+ar(total)+' · Restitué : '+ar(returned)+' · '+(gap===0?'Montant équilibré':gap>0?'Solde restant : '+ar(gap):'Dépassement : '+ar(-gap));
  };
  document.querySelectorAll('#actionForm [data-proof-amount]').forEach(e=>e.addEventListener('input',updateBalance));
  document.querySelectorAll('#actionForm [data-review-download]').forEach(b=>b.onclick=()=>runAction(()=>call('downloadProof',token,b.dataset.reviewDownload)));
  updateBalance();
}
function readBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');reader.onerror=()=>reject(Error('Lecture du fichier impossible.'));reader.readAsDataURL(file)})}
function createProjectPrompt(){const name=prompt('Nom du nouveau tournage / projet :');if(!name)return;runAction(async()=>{await call('addProject',token,name);toast('Projet créé.');await load()})}
(async function start(){if(!supabaseClient){showLogin('Impossible de charger la librairie Supabase. Veuillez vérifier votre connexion.');return;}await load();
  setInterval(()=>{if(state&&Date.now()-lastRefreshAt>=120000)refreshNotifications()},120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&Date.now()-lastRefreshAt>=60000)refreshNotifications()});
})()
</script>
</body>
</html>
